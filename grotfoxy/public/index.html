<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="GrotFoxy — self-hosted autonomous AI teammates. No subscription." />
    <title>GrotFoxy</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot__mark" aria-hidden="true"></div>
      <p>Waking the den…</p>
    </div>

    <div id="app" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__text">Grot<b>Foxy</b></span>
        </div>

        <nav class="sidebar__nav" id="nav"></nav>

        <div class="sidebar__foot">
          <div class="host-chip" id="hostChip" title="This instance runs entirely on your own machine">
            <span class="host-chip__dot"></span>
            <span id="hostName">self-hosted</span>
          </div>
          <button class="btn btn--ghost btn--sm" id="signOut" type="button">Sign out</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="iconbtn topbar__menu" id="menuToggle" type="button" aria-label="Menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <h1 class="topbar__title" id="pageTitle">Dashboard</h1>
          <div class="topbar__actions">
            <span class="conn" id="connState" title="Live connection"><i></i>live</span>
            <button class="iconbtn" id="bellBtn" type="button" aria-label="Notifications">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8" />
                <path d="M13.7 21a2 2 0 0 1-3.4 0" />
              </svg>
              <span class="badge" id="bellBadge" hidden>0</span>
            </button>
          </div>
        </header>

        <div class="view" id="view"></div>
      </main>

      <div class="drawer" id="drawer" hidden>
        <div class="drawer__head">
          <h2>Notifications</h2>
          <div>
            <button class="btn btn--ghost btn--sm" id="markRead" type="button">Mark all read</button>
            <button class="iconbtn" id="drawerClose" type="button" aria-label="Close">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </div>
        </div>
        <div class="drawer__body" id="drawerBody"></div>
      </div>
      <div class="scrim" id="scrim" hidden></div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
